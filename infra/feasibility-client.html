<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בדיקת MVP - תיעוד שטח</title>
  <style>
    :root{--ink:#17202a;--muted:#63717c;--line:#dce2e6;--blue:#1769e0;--teal:#087f73;--bg:#f2f4f5;--warn:#b45f00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;padding:16px}h1{font-size:1.45rem;margin:8px 0 4px}p{color:var(--muted);line-height:1.4}.card{padding:14px;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:grid;gap:6px;margin-top:12px;font-weight:700}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:6px}button{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-weight:700}.secondary{background:#eef5ff;color:var(--blue);border:1px solid #b5c7d9}.ok{color:var(--teal);font-weight:700}.warn{color:var(--warn);font-weight:700}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:6px;margin-top:8px;background:#edf1f3}.result{white-space:pre-wrap;direction:ltr;text-align:left;background:#101820;color:#d7fbe8;padding:12px;border-radius:8px;overflow:auto}.small{font-size:.82rem}.status{padding:10px;border-radius:6px;background:#f6f8f9;color:var(--muted);font-size:.9rem}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.counts span{padding:8px;border-radius:6px;background:#f6f8f9;text-align:center;font-weight:700}
  </style>
</head>
<body>
  <main class="app">
    <h1>בדיקת MVP - תיעוד שטח</h1>
    <p>בדיקה מהטלפון: רשימות מרחבים/יישובים, GPS, צילום דחוס, שמירה לגוגל שיט ודרייב.</p>
    <p id="startupStatus" class="status">טוען...</p>

    <section class="card">
      <label>כתובת backend
        <input id="backendUrl" placeholder="https://script.google.com/macros/s/.../exec">
      </label>
      <button id="saveConfig" class="secondary" type="button">שמור כתובת וטעון רשימות</button>
      <button id="reloadHierarchy" class="secondary" type="button">טען רשימות מחדש</button>
      <button id="setupWorkspace" class="secondary" type="button">בדיקת setup</button>
      <button id="healthCheck" class="secondary" type="button">בדיקת backend</button>
      <p id="configStatus" class="small">עדיין לא נטענו רשימות.</p>
      <div class="counts" aria-label="ספירת רשימות">
        <span id="districtCount">0 מחוזות</span>
        <span id="merhavCount">0 מרחבים</span>
        <span id="settlementCount">0 יישובים</span>
      </div>
    </section>

    <section class="card">
      <label>מחוז
        <select id="districtSelect"></select>
      </label>
      <label>מרחב
        <select id="merhavSelect"></select>
      </label>
      <label>יישוב
        <select id="settlementSelect"></select>
      </label>
      <label>סוג נקודה
        <select id="pointType">
          <option value="signage">שילוט</option>
          <option value="booth">דוכן</option>
          <option value="cluster">אשכול / קלפי</option>
        </select>
      </label>
      <label>מספר / כותרת נקודה <input id="pointNumber" value="אשכול זהב 014"></label>
      <label>כתובת / נקודת ציון <input id="plannedAddress" value="כפר סבא, צומת ויצמן"></label>
      <label>מי ממלא <input id="documentedBy" placeholder="שם / טלפון"></label>
      <label>הערות <textarea id="notes" rows="3" placeholder="הערה קצרה מהשטח"></textarea></label>
      <button id="captureLocation" type="button" class="secondary">קח מיקום GPS נוכחי</button>
      <p id="locationStatus" class="small">עדיין לא נשמר מיקום GPS.</p>
    </section>

    <section class="card">
      <label>צילום
        <input id="photoInput" type="file" accept="image/*" capture="environment">
      </label>
      <img id="preview" class="preview" alt="" hidden>
      <p id="photoStatus" class="small">התמונה תידחס לפני העלאה לדרייב.</p>
      <label>תיאור צילום <input id="caption" placeholder="מה רואים בתמונה?"></label>
    </section>

    <section class="card">
      <button id="submitTest" type="button">שמור נקודת בדיקה</button>
      <p class="small">אמור להיווצר שורה בגוגל שיט ותמונה דחוסה בדרייב.</p>
      <div id="result" class="result" hidden></div>
    </section>
  </main>

  <script>
    const DEFAULT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbyKGdThaFdAWX-yW-Vy_Lt1jy6nDbLPrIGfqIZ7A2BDg45tmS8PaoTeyf9IIEa6HZh6Nw/exec";
    const state = { photo: null, location: null, hierarchy: null };
    let backendInput;

    window.addEventListener("error", (event) => {
      showResult({ ok: false, error: event.message || "Page script error" });
    });

    document.addEventListener("DOMContentLoaded", () => {
      backendInput = document.getElementById("backendUrl");
      backendInput.value = localStorage.getItem("fieldDocBackendUrl") || DEFAULT_BACKEND_URL;
      bind("saveConfig", saveConfig);
      bind("healthCheck", checkBackend);
      bind("setupWorkspace", setupWorkspace);
      bind("reloadHierarchy", loadHierarchy);
      bind("captureLocation", captureLocation);
      bind("submitTest", submitTest);
      bindPhotoInput();
      document.getElementById("districtSelect").addEventListener("change", renderHierarchy);
      document.getElementById("merhavSelect").addEventListener("change", renderHierarchy);
      if (backendInput.value.trim()) {
        loadHierarchy();
      }
      setStartup("הטופס מוכן. הרשימות ייטענו אוטומטית.", true);
    });

    function bind(id, handler) {
      const element = document.getElementById(id);
      if (!element) throw new Error(`Missing button: ${id}`);
      element.addEventListener("click", handler);
    }

    function setStartup(message, ok) {
      const status = document.getElementById("startupStatus");
      status.textContent = message;
      status.className = ok ? "status ok" : "status warn";
    }

    function saveConfig() {
      const url = backendInput.value.trim();
      const status = document.getElementById("configStatus");
      if (!url) {
        status.textContent = "הדביקו קודם כתובת backend.";
        status.className = "small warn";
        showResult({ ok: false, error: "חסרה כתובת backend." });
        return;
      }
      try {
        localStorage.setItem("fieldDocBackendUrl", url);
        status.textContent = "הכתובת נשמרה. טוען רשימות...";
      } catch (error) {
        status.textContent = "הכתובת התקבלה להפעלה הנוכחית.";
      }
      status.className = "small ok";
      showResult({ ok: true, message: "כתובת backend נשמרה. טוען רשימות...", savedUrlStart: url.slice(0, 45) });
      loadHierarchy();
    }

    async function checkBackend() {
      const url = getBackendUrl();
      if (!url) return;
      showResult({ ok: true, message: "בודק backend..." });
      const data = await getJson(`${url}?action=health`);
      showResult(data);
    }

    async function setupWorkspace() {
      const url = getBackendUrl();
      if (!url) return;
      showResult({ ok: true, message: "מריץ setup..." });
      const data = await getJson(`${url}?action=setup`);
      showResult(data);
      if (data && data.ok) {
        loadHierarchy();
      }
    }

    async function loadHierarchy() {
      const url = getBackendUrl();
      if (!url) return;
      const status = document.getElementById("configStatus");
      status.textContent = "טוען מחוזות, מרחבים ויישובים...";
      status.className = "small";
      const data = await getJson(`${url}?action=hierarchy`);
      if (!data.ok) {
        status.textContent = "לא הצלחתי לטעון רשימות. לחצו בדיקת setup ואז טען רשימות מחדש.";
        status.className = "small warn";
        showResult(data);
        return;
      }
      state.hierarchy = data;
      renderHierarchy();
      const districtCount = (data.districts || []).length;
      const merhavCount = (data.merhavim || []).length;
      const settlementCount = (data.settlements || []).length;
      document.getElementById("districtCount").textContent = `${districtCount} מחוזות`;
      document.getElementById("merhavCount").textContent = `${merhavCount} מרחבים`;
      document.getElementById("settlementCount").textContent = `${settlementCount} יישובים`;
      status.textContent = `נטענו ${districtCount} מחוזות, ${merhavCount} מרחבים, ${settlementCount} יישובים.`;
      status.className = merhavCount && settlementCount ? "small ok" : "small warn";
      if (!merhavCount || !settlementCount) {
        showResult({ ok: false, error: "הרשימות נטענו אבל הן ריקות. בדקו setup/synchierarchy.", data });
      }
    }

    function renderHierarchy() {
      const data = state.hierarchy || {};
      const districts = data.districts || [];
      const merhavim = data.merhavim || [];
      const settlements = data.settlements || [];
      const districtSelect = document.getElementById("districtSelect");
      const merhavSelect = document.getElementById("merhavSelect");
      const settlementSelect = document.getElementById("settlementSelect");
      const currentDistrict = districtSelect.value;
      const currentMerhav = merhavSelect.value;
      const currentSettlement = settlementSelect.value;

      fillSelect(districtSelect, districts.map((item) => ({
        value: item.districtId,
        label: item.districtName
      })), "לא נטענו מחוזות");

      if (currentDistrict && districts.some((item) => item.districtId === currentDistrict)) {
        districtSelect.value = currentDistrict;
      }

      const selectedDistrict = districtSelect.value;
      const filteredMerhavim = merhavim.filter((item) => !selectedDistrict || item.districtId === selectedDistrict);
      fillSelect(merhavSelect, filteredMerhavim.map((item) => ({
        value: item.merhavId,
        label: item.merhavName
      })), "לא נטענו מרחבים");
      if (currentMerhav && filteredMerhavim.some((item) => item.merhavId === currentMerhav)) {
        merhavSelect.value = currentMerhav;
      }

      const selectedMerhav = merhavSelect.value;
      const filteredSettlements = settlements.filter((item) => !selectedMerhav || item.merhavId === selectedMerhav);
      fillSelect(settlementSelect, filteredSettlements.map((item) => ({
        value: item.settlementId,
        label: item.settlementName
      })), "לא נטענו יישובים");
      if (currentSettlement && filteredSettlements.some((item) => item.settlementId === currentSettlement)) {
        settlementSelect.value = currentSettlement;
      }
    }

    function fillSelect(select, options, emptyLabel) {
      const previous = select.value;
      select.innerHTML = "";
      if (!options.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = emptyLabel;
        select.appendChild(option);
        select.value = "";
        return;
      }
      options.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });
      select.value = options.some((item) => item.value === previous) ? previous : options[0].value;
    }

    function captureLocation() {
      const status = document.getElementById("locationStatus");
      if (!navigator.geolocation) {
        status.textContent = "GPS לא זמין בדפדפן הזה.";
        status.className = "small warn";
        return;
      }
      status.textContent = "לוקח מיקום GPS...";
      navigator.geolocation.getCurrentPosition((position) => {
        state.location = {
          lat: Number(position.coords.latitude.toFixed(6)),
          lng: Number(position.coords.longitude.toFixed(6)),
          accuracy: Math.round(position.coords.accuracy)
        };
        status.textContent = `נשמר: ${state.location.lat}, ${state.location.lng} (דיוק ${state.location.accuracy} מ')`;
        status.className = "small ok";
      }, (error) => {
        status.textContent = `לא הצליח לקחת GPS: ${error.message || "בעיית הרשאה/מיקום"}`;
        status.className = "small warn";
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
    }

    function bindPhotoInput() {
      document.getElementById("photoInput").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          document.getElementById("photoStatus").textContent = "דוחס תמונה...";
          state.photo = await compressImage(file, 1600, 0.76);
          const preview = document.getElementById("preview");
          preview.src = state.photo.dataUrl;
          preview.hidden = false;
          document.getElementById("photoStatus").textContent =
            `נדחס ל-${Math.round(state.photo.bytes / 1024)} KB, ${state.photo.width}x${state.photo.height}.`;
        } catch (error) {
          document.getElementById("photoStatus").textContent = `צילום נכשל: ${error.message || error}`;
          document.getElementById("photoStatus").className = "small warn";
        }
      });
    }

    async function submitTest() {
      const url = getBackendUrl();
      if (!url) return;
      const districtSelect = document.getElementById("districtSelect");
      const merhavSelect = document.getElementById("merhavSelect");
      const settlementSelect = document.getElementById("settlementSelect");
      const hierarchy = state.hierarchy || {};
      const district = (hierarchy.districts || []).find((item) => item.districtId === districtSelect.value) || {};
      const merhav = (hierarchy.merhavim || []).find((item) => item.merhavId === merhavSelect.value) || {};
      const settlement = (hierarchy.settlements || []).find((item) => item.settlementId === settlementSelect.value) || {};
      const payload = {
        action: "submitFeasibility",
        pointId: `POINT-${Date.now()}`,
        districtId: district.districtId || "",
        districtName: district.districtName || "",
        merhavId: merhav.merhavId || "",
        merhavName: merhav.merhavName || "",
        settlementId: settlement.settlementId || "",
        settlementName: settlement.settlementName || "",
        type: document.getElementById("pointType").value,
        number: document.getElementById("pointNumber").value || "בדיקה 001",
        town: settlement.settlementName || "",
        plannedAddress: document.getElementById("plannedAddress").value,
        correctedLocation: state.location,
        documentedBy: document.getElementById("documentedBy").value,
        notes: document.getElementById("notes").value,
        photos: state.photo ? [{
          itemKey: "feasibility",
          caption: document.getElementById("caption").value,
          fileName: state.photo.fileName,
          mimeType: "image/jpeg",
          base64: state.photo.base64,
          width: state.photo.width,
          height: state.photo.height
        }] : []
      };
      showResult({ ok: true, message: "שומר נקודה..." });
      const data = await postJson(url, payload);
      showResult(data);
    }

    function getBackendUrl() {
      const url = backendInput.value.trim();
      if (!url) {
        showResult({ ok: false, error: "חסרה כתובת backend." });
        return "";
      }
      try {
        localStorage.setItem("fieldDocBackendUrl", url);
      } catch (error) {
        // The URL still works for this session even if browser storage is blocked.
      }
      return url;
    }

    async function getJson(url) {
      try {
        const response = await fetch(url);
        return await parseResponse(response);
      } catch (error) {
        return { ok: false, error: String(error) };
      }
    }

    async function postJson(url, payload) {
      try {
        const response = await fetch(url, {
          method: "POST",
          body: JSON.stringify(payload),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
        return await parseResponse(response);
      } catch (error) {
        return { ok: false, error: String(error) };
      }
    }

    async function parseResponse(response) {
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (error) {
        return { ok: false, status: response.status, error: "Response was not JSON.", bodyStart: text.slice(0, 500) };
      }
    }

    async function compressImage(file, maxWidth, quality) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxWidth / bitmap.width);
      const width = Math.round(bitmap.width * scale);
      const height = Math.round(bitmap.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
      const dataUrl = await blobToDataUrl(blob);
      return {
        dataUrl,
        base64: dataUrl.split(",")[1],
        bytes: blob.size,
        width,
        height,
        fileName: file.name.replace(/\.[^.]+$/, "") + "-compressed.jpg"
      };
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    function showResult(data) {
      const result = document.getElementById("result");
      result.hidden = false;
      result.textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
